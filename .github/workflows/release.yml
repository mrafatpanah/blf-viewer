name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'  # ovsx 1.3 and vsce 4 need Node >= 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run package

      - name: Package VSIX
        run: npx --yes @vscode/vsce@4.0.0 package --no-dependencies

      - name: Create GitHub Release
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" *.vsix --clobber
          else
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              --verify-tag \
              *.vsix
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # --skip-duplicate keeps a job rerun from failing on an already-published version.
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1.3.0 publish *.vsix --skip-duplicate -p "$OVSX_PAT"

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce@4.0.0 publish --packagePath *.vsix --skip-duplicate -p "$VSCE_PAT"
